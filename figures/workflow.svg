   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18324b" x="61.461574" y="29.592" transform="rotate(-0 61.461574 29.592)">One physical calculation for every study</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596774" x="61.461574" y="50.6592" transform="rotate(-0 61.461574 50.6592)">Sensitivity · linked materials · property search · confirmation · spatial refinement · tolerance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30658a" x="127.621255" y="95.274512" transform="rotate(-0 127.621255 95.274512)">Material properties</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(81.460396 111.901127)">Measured records or</text>
