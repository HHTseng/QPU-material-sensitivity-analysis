# Stage 4 projection pools: the real materials a property target is projected onto.
#
# PROVENANCE DISCIPLINE, unchanged from material_catalog.yaml and worth
# restating because this file introduces values the simulation has never used:
#
#   verified: true   -- the value is already in this project's curated catalog,
#                       with the provenance recorded there, and has been used in
#                       a simulation that produced a checked-in result.
#   verified: false  -- a standard-reference handbook value entered for
#                       PROJECTION ONLY. It is good enough to rank candidates by
#                       distance; it is NOT good enough to fabricate from, and
#                       any finalist must have its properties re-sourced with a
#                       citation before it is treated as a materials claim.
#
#   null             -- NOT KNOWN. A null is excluded from the distance and
#                       counted as an unmatched feature, never imputed. A
#                       candidate matched on 3 of 6 features is a different
#                       claim from one matched on 6 of 6, and the report says so.
#
# SOUND-SPEED CONVENTION -- read this before using the numbers.
# The project's own film speeds are internally inconsistent: Ta 4159 and Au 3240
# are bulk LONGITUDINAL speeds, while Nb 2444 and Cu 2608 are much closer to
# those metals' DEBYE-AVERAGED speeds (Nb v_L = 5060, Cu v_L = 4760). Because a
# film's speed enters the objective through the macro AND enters the projection
# metric through the impedance Z = rho*v, that inconsistency cannot be resolved
# silently. Each entry therefore carries up to three speeds:
#
#   vsound_catalog_m_s      what this project has actually simulated (if any)
#   vsound_longitudinal_m_s bulk longitudinal
#   vsound_transverse_m_s   bulk transverse
#
# and stage4_project_material.py computes the Debye average from the last two
# where both exist. `--film-speed-convention` selects which is compared, and the
# report gives the distance under more than one so the ranking's dependence on
# the convention is visible rather than assumed away.

meta:
  created_utc: "2026-08-21"
  purpose: "nearest-real-material projection of a Stage 4 property target"
  substrate_pool_file: catalog/substrates_raw.json     # 396 cubic MP materials
  substrate_filters_already_applied:
    - "crystal_system = Cubic"
    - "is_metal = false"
    - "num_magnetic_sites = 0"
    - "theoretical = false (experimentally observed)"
    - "energy_above_hull <= 0.1 eV/atom"
    - "elements U, Th, Np excluded"
    - "Born stability and cubic tensor validation passed"

# ---------------------------------------------------------------------------
# Substrates with a COMPLETE G4CMP lattice record. Only these carry the
# anharmonic constants (scat, decay, decayTT), so only these can be matched on
# the phonon-downconversion features -- for every other candidate those three
# features are unmatched, which is a real and reportable gap.
# `g4_carrier` is the NIST material whose density Geant4 would use; absent means
# the material cannot be simulated without adding one (see
# stage4_probe_g4_density.py).
# ---------------------------------------------------------------------------
g4cmp_substrates:
  Si:
    verified: true
    g4_carrier: G4_Si
    density_kg_m3: 2330.0
    lattice_a_ang: 5.431
    c11_GPa: 165.6
    c12_GPa: 63.9
    c44_GPa: 79.5
    scat_s3: 2.43e-42
    decay_s4: 7.41e-56
    decayTT: 0.74
    debye_THz: 15.0
    source: "G4CMP CrystalMaps/Si/config.txt; density measured from a live run"
  Ge:
    verified: true
    g4_carrier: G4_Ge
    density_kg_m3: 5323.0
    lattice_a_ang: 5.658
    c11_GPa: 126.0
    c12_GPa: 44.0
    c44_GPa: 67.0
    scat_s3: 3.67e-41
    decay_s4: 1.6456e-54
    decayTT: 0.74
    debye_THz: 2.0
    source: "G4CMP CrystalMaps/Ge/config.txt; density measured from a live run"
  GaAs:
    verified: true
    g4_carrier: G4_GALLIUM_ARSENIDE
    density_kg_m3: 5310.0
    lattice_a_ang: 5.75
    c11_GPa: 121.57
    c12_GPa: 57.4
    c44_GPa: 59.5
    scat_s3: 7.22e-42
    decay_s4: 7.778e-55
