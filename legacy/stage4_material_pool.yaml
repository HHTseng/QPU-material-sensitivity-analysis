# ---------------------------------------------------------------------------
# Superconducting films (top ground plane).
#
# gap_eV is the SINGLE-quasiparticle gap Delta. Where a measured T=0 gap is
# established it is used; otherwise the BCS relation Delta = 1.764 k_B Tc is
# applied and `gap_source: bcs_from_tc` says so. Nb and Pb are strong-coupling
# (2Delta/kTc = 3.9 and 4.4 against BCS 3.53), which is exactly why the measured
# value is preferred where it exists.
#
# ph_lifetime_ns is null for every film this project has not been given a
# sourced value for. That is the single largest gap in the film pool and it is
# left visible rather than filled.
# ---------------------------------------------------------------------------
