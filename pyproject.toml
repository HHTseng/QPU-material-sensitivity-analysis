[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scan"
version = "0.1.0"
description = "Reproducible G4CMP material-parameter experiments"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "PyYAML==6.0.3",
  "scipy==1.17.1",
]

[project.scripts]
material-scan = "material_scan.cli:main"

[tool.setuptools.packages.find]
include = ["material_scan*"]

[tool.setuptools.package-data]
material_scan = ["*.yaml", "*.md", "scripts/*.sh"]
