[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scan"
version = "0.3.0"
description = "Scientific G4CMP material-property studies"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "PyYAML==6.0.3",
  "scipy==1.17.1",
]

[project.scripts]
material-scan = "scan:main"

[project.optional-dependencies]
sensitivity = ["SALib==1.5.2"]
presentation = ["python-pptx==1.0.2"]
catalog = ["mp-api"]
tpe = ["optuna"]

[tool.setuptools]
py-modules = ["scan", "physics", "analysis", "search", "records"]
