# Explicit allowlist for the initial 2 x 2 x 2 material pilot.
# Copy to small_material_candidates.yaml only after replacing and validating
# every placeholder. Disabled records must not be accepted by the resolver.

fixed_junction:
  id: al_junction
  enabled: true
  g4_material: G4_Al
  source: existing_validated_baseline

substrates:
  - id: si
    enabled: true
    mp_id: mp-149
    g4_material: G4_Si
    g4cmp_lattice: Si
    source: existing_validated_baseline

  - id: ge
    enabled: false
    mp_id: REPLACE_WITH_VERIFIED_GE_MP_ID
    g4_material: G4_Ge
    g4cmp_lattice: Ge
    source: REPLACE_WITH_CATALOG_RECORD

top_ground_films:
  - id: nb
    enabled: true
    mp_id: null
    g4_material: G4_Nb
    source: existing_validated_baseline

  - id: second_high_gap_film
    enabled: false
    mp_id: null
    g4_material: REPLACE_WITH_G4_MATERIAL
    source: REPLACE_WITH_CRYOGENIC_FILM_RECORD
    requirements:
      gap_eV_greater_than: 0.0005
      reason: Preserve E_gun_1meV_below_2Delta_top_film

bottom_films:
  - id: cu
    enabled: true
    mp_id: null
    g4_material: G4_Cu
    model: normal
    source: existing_validated_baseline

  - id: ti
    enabled: false
    mp_id: null
    g4_material: G4_Ti
    model: normal
    source: REPLACE_WITH_CRYOGENIC_FILM_RECORD

