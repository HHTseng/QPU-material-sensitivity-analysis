question:
  spatial: Does 2048 agree with its balanced 1024 subset within 5 percent at the same per-position primaries?
  fixed_work: How does 2048 x 15625 compare with retained 1024 x 31250 at equal total primaries?
  transport: How does the new 1024 subset at 15625 compare with the same positions at 31250?
  selection: First four layouts and all six 0/45-degree cases fixed before seeing their results; no optimizer
    or material selection.
comparison:
  family_error: 0.05
  meaningful_reduction: 0.05
  pairs:
  - candidate: Si-0deg
    reference: Si-45deg
  - candidate: Ge-0deg
    reference: Ge-45deg
  - candidate: GaAs-0deg
    reference: GaAs-45deg
  - candidate: Ge-0deg
    reference: Si-0deg
  - candidate: GaAs-0deg
    reference: Si-0deg
  primary: Six spatial mean-ratio contrasts, 2048 versus nested 1024 at 15625 primaries per task; Bonferroni
    family error 0.05 and equivalence margin +/-5 percent.
  secondary: Equal-total-primary and half-primary-count comparisons are descriptive paired 95 percent
    intervals; they do not define spatial convergence.
  stopping: Complete all four layouts. No optional stopping and no larger source design.
expected_work:
  new_primaries: 3072000000
  new_tasks: 196608
  reference_primaries_reused_for_comparison: 3072000000
  active_elapsed_hours:
  - 3
  - 6
  workers: 86
  gpus: 0
  memory_limit_gib: 64
  extra_working_disk_gib:
  - 12
  - 20
  scheduling: Wait for the current native queue lock, then retain that lock throughout verification. No
    overlapping transport pools.
  estimate_note: 25 to 50 percent more time than a 1024-site cohort at equal total primaries; hardware
    load and source-dependent transport can extend the estimate.
limitations:
- This verification covers six fixed native 0/45-degree cases, not every orientation or optimized leader.
- Four independent layouts give broad Student-t intervals, especially for rare concentrated responses.
  Failure to establish equivalence does not establish a physical change.
- The pure spatial contrast uses the new nested subset at the same per-position primary count. Comparing
  against the older 1024 cohort also changes per-position primaries.
- Mean layout ratios differ from a ratio of pooled means. Area-weight uncertainty and model assumptions
  are not inferred from these checks.
- All original measurements remain unchanged. Two verified archives retain each new layout before raw
  working data are cleared.
