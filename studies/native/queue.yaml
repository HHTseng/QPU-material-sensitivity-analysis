comparison:
  family_error: 0.05
  meaningful_reduction: 0.05
  pairs:
  - candidate: Si-0deg
    reference: Si-45deg
  - candidate: Ge-0deg
    reference: Ge-45deg
  - candidate: GaAs-0deg
    reference: GaAs-45deg
  - candidate: Ge-0deg
    reference: Si-0deg
  - candidate: GaAs-0deg
    reference: Si-0deg
  uncertainty: Paired layout differences and layout response ratios; five fixed native comparisons use
    Bonferroni family error 0.05. BO versus Sobol is paired over complete matched search seeds, conditional
    on four shared confirmation layouts.
  stopping: Eight benchmark layouts, all declared measured search targets or explicit termination, then
    four unused confirmation layouts. No 2048-site transport is included.
expected_work:
  primaries_upper_bound: 48384000000
  tasks_upper_bound: 1548288
  confirmation_targets_upper_bound: 33
  elapsed_hours:
  - 36
  - 60
  gpus: 0
  cpu_hours:
  - 2500
  - 4000
  working_disk_gib:
  - 35
  - 55
  disk_reserve_gib: 20
  sampling_prediction: Independent-stratum approximation from eight old layouts predicts SE factors 0.71
    for Si, 0.50 for Ge and 0.52 for GaAs. Cross-region correlations and new orientations can change this.
  confirmation_note: Use four realizations of 31250 primaries because native layout variation exceeded
    transport uncertainty. Both errors remain measured.
limitations:
- A native lattice keeps density, elasticity and phonon rates coupled. Film lifetimes and interface fields
  still contain model assumptions.
- The in-plane range is 0 to 359 degrees. The excluded final degree avoids duplicating the 360 degree
  endpoint; the study does not claim an exact global orientation minimum.
- The half-layout comparison is a balanced subset of the same 1024-site outputs, fixed before transport.
  It is not a separately simulated 512-site experiment.
- Eight benchmark and four confirmation layouts do not prove spatial convergence across the orientation
  domain.
- Three optimizer seeds give exploratory algorithm comparisons. Position layouts are not additional optimizer
  repetitions; incomplete arms remain visible.
- No new LLM inference, material identification, fabrication optimum or qubit-error claim is implied.
