schema: material-scan-native-optimization-1
id: native-orientation-20261028
description: 'Native crystal orientation: reallocated 1024-site checks, three-seed BO versus Sobol, and
  independent confirmation.'
question:
  sampling: Does reallocation reduce near-junction position variation without changing the area integral?
  rotation: Does the 0 degree gain persist in native Si, Ge or GaAs with their own coupled properties?
  optimization: Does BO improve on shared measured starts and Sobol in three-dimensional crystal orientation?
  previous_run: orientation_materials_20261026
  selection_uses_confirmation: false
defaults:
  temperature_K: 0.02
  gun_energy_eV: 0.01
  junction_gap_eV: 0.000191
  cutoff_eV: 3.82e-05
  nb_gap_min_eV: 0.0015384
  source_half_span_mm: 4.0
  source_law: uniform_surface
  objective: device_junction_qps_per_eV
  seed_base: 20261028
  bootstrap_draws: 1000
  design_counts:
  - 512
  - 1024
  allocations:
    '512':
    - 17
    - 256
    - 51
    - 85
    - 103
