  - 1.0
  orientation_azimuth_turns:
  - 0.0
  - 1.0
optimizer_options:
  n_init: 12
  n_restarts: 3
  n_candidates: 4096
  extra_candidates: 8
  proposal_min_distance: 0.03
  local_width: 0.08
  local_adapt: false
  runtime_aware: false
  refit_every: 4
  transform: log
