  - 2026102805
  - 2026102806
  - 2026102807
  - 2026102808
  confirmation_position_seeds:
  - 2026102901
  - 2026102902
  - 2026102903
  - 2026102904
  area_seed: 0
  area_samples: 8000000
  design_note: Fresh positions, reallocated toward the near-junction region. All area fractions are unchanged;
    no historical position is removed or overwritten.
  source_note: The chip is 10x10 mm2; the declared injection region is 8x8 mm2.
  max_sites: 1024
  base_design_file: figures/spatial_sites.json
  fresh_designs: true
execution:
  independent_archive_root: /data/htseng/material-scan-archives
  max_cpu_fraction: 0.5
  max_memory_fraction: 0.5
  workers: 86
  total_mem_gb: 64.0
  reserved_mem_gb: 16.0
  minimum_free_disk_gb: 20.0
  per_task_mem_gb: 2.0
  blas_threads: 1
  timeout_s: 21600
  stall_timeout_s: 7200
  failed_response: missing
  timeout_note: A task exceeding six hours is right-censored; it never supplies a zero response.
  queue_order: sequential_studies
  stop_after_initial_checks: false
  llm_cpu_count: 8
  max_gpus: 0
search_bounds: {}
