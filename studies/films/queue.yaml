comparison:
  family_error: 0.05
  meaningful_reduction: 0.05
  pairs:
  - candidate: Si-corner-03
    reference: Si-reference
  - candidate: GaAs-corner-03
    reference: GaAs-reference
  primary: 'Six fixed comparisons: BO/shared initial winner, Sobol/shared initial winner and BO/Sobol
    for each substrate. Average paired response ratios across six search seeds and eight position layouts.
    Sum the seed-mean and layout-mean variance estimates, with Student-t df=min(5,7) and Bonferroni family
    error 0.05. A meaningful reduction requires the entire interval below minus 5 percent. All six planned
    matched seeds must finish.'
  physical: Selected designs and fixed corners are compared with the respective 75 nm Nb / 1 um Cu reference
    on eight unused layouts. Simultaneous intervals use the predeclared 44-target upper bound.
  sampling: Eight paired layouts at equal total primaries and eight fixed cases. Adjusted paired layout-ratio
    intervals and total study elapsed time are reported. Variance ratios are descriptive. The paired search
    design is fixed in advance, independently of these diagnostics.
  stopping: Run eight sampling pairs, six complete matched optimizer seeds per substrate, and eight unused
    confirmation layouts. Incomplete arms remain absent and prevent a full primary conclusion. No increased
    site count or new LLM inference.
expected_work:
  primaries_upper_bound: 76800000000
  sampling_primaries: 8192000000
  screening_primaries: 46080000000
  confirmation_primaries_upper_bound: 22528000000
  confirmation_targets_upper_bound: 44
  elapsed_hours:
  - 72
  - 120
  workers: 86
  cpu_cap: 96
  gpus: 0
  memory_limit_gib: 64
  estimated_archive_copies_gib:
  - 35
  - 50
  working_location: /data/htseng/material-scan-work/film_design_20261030_bounded
  independent_archive_location: /home/htseng/Sensitivity_Analysis_HT/material_scan_data/film_archive_copies/film_design_20261030_bounded
  estimate_note: The previous native rate was 1.325 billion primaries/hour. The 200 nm Nb timing diagnostic
    was about 13 times slower, so the main range is 75 to 100 nm. Smaller per-task counts and changed
    coverage add cost; update after the complete sampling comparison.
limitations:
- These are model predictions for named substrates with fixed Nb/Cu property records, not discovery of
  a new compound or measured qubit-error reduction.
- Nb thickness 75 to 100 nm is a chosen design interval anchored by the 75 nm reference and demonstrated
  100 nm films. A 200 nm timing diagnostic was about 13 times slower and is retained outside the optimization.
  Fixed Nb gap and lifetime across this interval remain model assumptions.
- Cu thickness 1 to 10 um at 250 um pitch keeps 0.064 mm3 Cu per 10 x 10 mm2 chip. Greater thickness reduces
  coverage; this family is not a measured device set.
- All four corners are in each shared initial table. Monotonic response can make a corner optimal, so
  no additional BO gain is promised.
- Seed and layout variance are estimated separately. Their sum is a conservative approximation counting
  seed-layout interaction twice, rather than an exact combined test.
- Eight unused confirmation layouts assess the selected points, not uniform convergence over every physical
  design.
