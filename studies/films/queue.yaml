schema: material-scan-film-optimization-1
id: native-film-design-20261030-bounded
description: 'Native Si and GaAs: Nb thickness and fixed-volume Cu island design, sampling comparison
  and matched BO/Sobol confirmation.'
question:
  sampling: At 64 million primaries per response, do two independent 512-position layouts improve position
    precision relative to one 512-position layout?
  physics: Can Nb thickness and Cu coverage at constant Cu volume reduce the native-device response J
    by at least 5 percent?
  optimization: Does BO reduce confirmed J by at least 5 percent beyond shared starts containing all four
    corners, and beyond Sobol?
  selection_uses_confirmation: false
defaults:
  temperature_K: 0.02
  gun_energy_eV: 0.01
  junction_gap_eV: 0.000191
  cutoff_eV: 3.82e-05
  nb_gap_min_eV: 0.0015384
  source_half_span_mm: 4.0
  source_law: uniform_surface
  objective: device_junction_qps_per_eV
  seed_base: 20261030
  bootstrap_draws: 1000
  design_counts:
  - 512
  - 1024
  allocations:
    '512':
    - 17
    - 256
    - 51
    - 85
    - 103
    '1024':
    - 34
    - 512
    - 102
    - 170
    - 206
  position_seed: 2026103000
  independent_position_seeds: []
  confirmation_position_seeds:
  - 2026110301
  - 2026110302
  - 2026110303
  - 2026110304
  - 2026110305
  - 2026110306
  - 2026110307
  - 2026110308
  area_seed: 0
  area_samples: 8000000
  design_note: Independent source pairs per search seed and eight unused confirmation layouts. All area
    fractions retain the declared 8 x 8 mm2 uniform source integral.
  source_note: The chip is 10x10 mm2; the declared injection region is 8x8 mm2.
  max_sites: 1024
  base_design_file: figures/spatial_sites.json
  fresh_designs: true
execution:
  independent_archive_root: /home/htseng/Sensitivity_Analysis_HT/material_scan_data/film_archive_copies
  max_cpu_fraction: 0.5
  max_memory_fraction: 0.5
  workers: 86
  total_mem_gb: 64.0
  reserved_mem_gb: 16.0
  minimum_free_disk_gb: 20.0
  per_task_mem_gb: 2.0
  blas_threads: 1
  timeout_s: 21600
  stall_timeout_s: 7200
  failed_response: missing
  timeout_note: A task exceeding six hours is right-censored; it never supplies a zero response.
  queue_order: sequential_studies
  stop_after_initial_checks: false
  llm_cpu_count: 8
  max_gpus: 0
