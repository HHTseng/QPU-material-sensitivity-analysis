    reference: target-45deg
  - candidate: Ge-Nb-Cu
    reference: Si-Nb-Cu
  - candidate: GaAs-Nb-Cu
    reference: Si-Nb-Cu
  uncertainty: Paired Student-t intervals of independent layout means and layout response ratios. Bonferroni
    correction over three fixed contrasts; report all outcomes.
  stopping: Complete all eight layouts. No early selection, no optional stopping and no expansion beyond
    1024 sites.
expected_work:
  layouts: 8
  candidates: 5
