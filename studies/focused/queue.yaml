  disk_reserve_gib: 20
  expectation: Rotation may retain a substantial gain. Native ranking may remain unresolved or reverse.
    These expectations do not define success.
  precision_note: At equal variance, eight layouts reduce the unadjusted mean standard error by sqrt(4/8)
    relative to four. For a 5 percent effect, simultaneous intervals may remain too wide.
limitations:
- A property target is not an identified material; its calibrated film properties remain fixed.
- Native materials keep their own density, elasticity and lattice records; film lifetimes and interfaces
  still include model assumptions.
- Matched random streams aid comparison but need not induce strong correlation when material paths differ.
- Eight 1024-site layouts do not establish spatial convergence. Report near-junction means and position
  variation.
- No fabrication optimum, global minimum or qubit-error reduction follows from junction-QP yield alone.
