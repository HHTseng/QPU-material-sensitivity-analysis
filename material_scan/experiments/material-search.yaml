  topfilm_gap: {mode: search, bounds: [1.5384e-3, 3.5e-3], scale: log, default: 1.670366222399775e-3, prior: {kind: log-uniform}}
  topfilm_ph_lifetime: {mode: search, bounds: [1.0e-3, 1.0], scale: log, default: 3.337436812440808e-3, prior: {kind: log-uniform}}
  topfilm_density: {mode: search, bounds: [2000.0, 20000.0], scale: linear, default: 15010.886904864794, prior: {kind: uniform}}
  bot_vsound: {mode: search, bounds: [1.5, 6.0], scale: linear, default: 3.174554206770729, prior: {kind: uniform}}
  bot_gap_thres: {mode: search, bounds: [5.0e-5, 3.82e-4], scale: linear, default: 1.2981738953147298e-4, prior: {kind: uniform}}
  bot_ph_lifetime: {mode: search, bounds: [0.5, 50.0], scale: log, default: 0.5, prior: {kind: log-uniform}}
  bot_density: {mode: search, bounds: [2000.0, 22000.0], scale: linear, default: 7184.383239418074, prior: {kind: uniform}}
  sub_c11: {mode: search, bounds: [20.0, 1100.0], scale: linear, default: 250.92689126211246, prior: {kind: uniform}}
  sub_c12: {mode: search, bounds: [0.0, 400.0], scale: linear, default: 0.0, prior: {kind: uniform}}
  sub_c44: {mode: search, bounds: [5.0, 600.0], scale: linear, default: 5.0, prior: {kind: uniform}}
  sub_scat: {mode: search, bounds: [1.0e-45, 5.0e-41], scale: log, default: 1.0e-44, prior: {kind: log-uniform}}
  sub_decay: {mode: search, bounds: [5.0e-57, 5.0e-54], scale: log, default: 6.129072648276415e-56, prior: {kind: log-uniform}}
  sub_decayTT: {mode: search, bounds: [0.5, 1.0], scale: linear, default: 0.8174135229343212, prior: {kind: uniform}}
  sub_lattice_a: {mode: fixed, value: 5.431}
  temperature: {mode: fixed, value: 0.02}
  lattice_deg: {mode: fixed, value: 45.0}
  orientation_polar_cos: {mode: fixed, value: 1.0}
  orientation_azimuth_turns: {mode: fixed, value: 0.0}

constraints:
  - {name: cubic-c11-minus-c12, kind: linear, terms: {sub_c11: 1.0, sub_c12: -1.0}, operator: '>', rhs: 0.0}
  - {name: cubic-c11-plus-two-c12, kind: linear, terms: {sub_c11: 1.0, sub_c12: 2.0}, operator: '>', rhs: 0.0}

