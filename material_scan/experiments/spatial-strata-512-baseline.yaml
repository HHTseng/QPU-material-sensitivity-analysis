schema: material-scan-experiment-1
id: spatial-strata-512-baseline-view
purpose: Reconstruct the corrected 512-site baseline from its recorded design.

parameters:
  topfilm_vsound: {mode: fixed, value: 2.444}
  topfilm_gap: {mode: fixed, value: 1.5384e-3}
  topfilm_ph_lifetime: {mode: fixed, value: 0.00417}
  topfilm_density: {mode: fixed, value: 8570.0}
  bot_vsound: {mode: fixed, value: 2.608}
  bot_gap_thres: {mode: fixed, value: 1.80e-4}
  bot_ph_lifetime: {mode: fixed, value: 5.1}
  bot_density: {mode: fixed, value: 8960.0}
  sub_c11: {mode: fixed, value: 165.6}
  sub_c12: {mode: fixed, value: 63.9}
  sub_c44: {mode: fixed, value: 79.5}
  sub_scat: {mode: fixed, value: 2.43e-42}
  sub_decay: {mode: fixed, value: 7.41e-56}
  sub_decayTT: {mode: fixed, value: 0.74}
  sub_lattice_a: {mode: fixed, value: 5.431}
  temperature: {mode: fixed, value: 0.0}
  lattice_deg: {mode: fixed, value: 45.0}
  orientation_polar_cos: {mode: fixed, value: 1.0}
  orientation_azimuth_turns: {mode: fixed, value: 0.0}

constraints:
  - name: cubic-c11-minus-c12
    kind: linear
    terms: {sub_c11: 1.0, sub_c12: -1.0}
    operator: '>'
    rhs: 0.0
  - name: cubic-c11-plus-two-c12
    kind: linear
    terms: {sub_c11: 1.0, sub_c12: 2.0}
    operator: '>'
    rhs: 0.0

sampling:
  kind: recorded-stratified
  design_file: ../../data/results/stage4_strat_512.json
  replicas: 8
  seed:
    algorithm: historical-position-v1
    base: 20260728
    bank_id: 9

event_counts:
  events_per_task: 31250
  events_total: 128000000
  gun_energy_eV: 0.010

physics:
  realization:
    schema: stage4_realization_v1
    mode: pseudo_si_base
    substrate_carrier: G4_Si
    base_lattice_map: Si
    lattice_map: PseudoCubic
  junction_gap_eV: 1.91e-4
  electrode_x_mm: [-2.0, 0.0, 2.0, -2.0, 0.0, 2.0, -2.0, 0.0, 2.0, 1.0, -1.0, 1.0, -1.0, -3.0, 1.0, -1.0, 3.0]
  electrode_y_mm: [-2.0, -2.0, -2.0, 0.0, 0.0, 0.0, 2.0, 2.0, 2.0, -3.0, -1.0, 1.0, 3.0, -1.0, -1.0, 1.0, 1.0]

analysis:
  objective: device_junction_qps_per_eV
  risk_95: report-only
  uncertainty: hierarchical-site-and-replica-bootstrap
  environment:
    python: '3.12'
    numpy: '2.4.6'
    pandas: '3.0.3'
    blas: runtime-recorded-on-analysis

search: {}

build:
  mode: historical-unresolved
  reason: The saved row hashes Main but does not identify every loaded library and data set.
  recorded:
    design_hash: fa659c7d860acdee

provenance:
  historical_campaign: stage4_property_v1_strat512
  historical_result: data/results/stage4_strat_512.json
