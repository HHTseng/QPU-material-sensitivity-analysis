   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #238b85" x="281.867092" y="203.382512" transform="rotate(-0 281.867092 203.382512)">Scientific checks</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(228.095607 220.009127)">Convergence, tolerance</text>
