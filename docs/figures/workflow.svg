   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18324b" x="55.643665" y="29.592" transform="rotate(-0 55.643665 29.592)">One physical calculation for every study</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596774" x="55.643665" y="50.6592" transform="rotate(-0 55.643665 50.6592)">Sensitivity · linked materials · property search · confirmation · spatial refinement · tolerance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30658a" x="121.803347" y="95.274512" transform="rotate(-0 121.803347 95.274512)">Material properties</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(75.642487 111.901127)">Measured records or</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(66.048347 123.004948)">selected property values</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #238b85" x="281.867092" y="95.231544" transform="rotate(-0 281.867092 95.231544)">Physical checks</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(232.109748 111.901127)">Units, elasticity, gaps,</text>
