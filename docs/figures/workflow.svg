   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d56c35" x="601.994582" y="203.382512" transform="rotate(-0 601.994582 203.382512)">Junction QPs</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(557.152082 220.009127)">q = round(Edep / Δ)</text>
