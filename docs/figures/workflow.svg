   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30658a" x="441.930837" y="95.274512" transform="rotate(-0 441.930837 95.274512)">Phonon transport</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(404.973884 111.901127)">Geant4 / G4CMP</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(385.620368 123.004948)">recorded sites and seeds</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30658a" x="601.994582" y="95.274512" transform="rotate(-0 601.994582 95.274512)">Recorded hits</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(560.624816 111.901127)">Deposited energy,</text>
