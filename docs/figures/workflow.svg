   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30658a" x="121.803347" y="203.382512" transform="rotate(-0 121.803347 203.382512)">Measured materials</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #18324b" transform="translate(58.309753 220.009127)">Measured feature coverage;</text>
